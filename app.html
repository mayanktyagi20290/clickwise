<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clickwise - Professional SEO Suite</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-container">
    <!-- Sidebar Navigation -->
    <aside class="sidebar">
      <div class="brand">
        Clickwise
        <span class="brand-badge">PRO OS</span>
      </div>
      <ul class="nav-list">
        <li class="nav-item active"><a href="#regex">Regex Studio</a></li>
        <li class="nav-item"><a href="#dashboard">Dashboard</a></li>
        <li class="nav-item"><a href="#opportunities">Opportunities</a></li>
        <li class="nav-item"><a href="#audit">Technical Audit</a></li>
        <li class="nav-item"><a href="#settings">Settings</a></li>
      </ul>
    </aside>

    <!-- Main Workspace Area -->
    <main class="main-content">
      <header class="page-header">
        <div>
          <h1 class="page-title">Regex Studio</h1>
          <p class="page-subtitle">Build, validate, and test Google Search Console regular expressions.</p>
        </div>
      </header>

      <div class="studio-grid">
        <!-- Configuration Panel -->
        <section class="panel">
          <div class="panel-header">
            <h2 class="panel-title">Pattern Configuration</h2>
            <button id="btn-copy" class="btn btn-secondary">Copy Pattern</button>
          </div>

          <div class="form-group">
            <label class="label" for="template-select">SEO Preset Templates</label>
            <select id="template-select" class="select"></select>
          </div>

          <div class="form-group">
            <label class="label" for="pattern-input">Regular Expression Statement</label>
            <input type="text" id="pattern-input" class="input code-input" value="^(who|what|where|when|why|how|can)\b">
          </div>

          <div class="form-group">
            <label class="label">Plain-English Rule Summary</label>
            <div id="explanation-box" class="input" style="background-color: var(--bg-tertiary); min-height: 60px;"></div>
          </div>

          <div class="form-group">
            <label class="label" for="test-input">Live Sample Queries (One Per Line)</label>
            <textarea id="test-input" class="textarea code-input" rows="6">how to run an seo audit
buy cheap keywords tool
clickwise pricing plans
what is technical seo
best keyword tracking application
where to find free backlinks</textarea>
          </div>
        </section>

        <!-- Live Evaluation Panel -->
        <section class="panel">
          <div class="panel-header">
            <h2 class="panel-title">Evaluation & Match Preview</h2>
            <span id="status-badge" class="status-tag status-match">0 / 0 Matches</span>
          </div>

          <div class="table-container">
            <table class="data-table">
              <thead>
                <tr>
                  <th>Query / String Payload</th>
                  <th>Result</th>
                </tr>
              </thead>
              <tbody id="results-body">
                <!-- Dynamically Populated -->
              </tbody>
            </table>
          </div>
        </section>
      </div>
    </main>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
